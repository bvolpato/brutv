version: 2
updates:
  - package-ecosystem: npm
    directories:
      - "/mobile/vega"
    schedule:
      interval: weekly
      day: tuesday
      time: "04:00"
      timezone: UTC
    cooldown:
      default-days: 7
    groups:
      dependency-updates:
        patterns: ["*"]
    open-pull-requests-limit: 2
  - package-ecosystem: gradle
    directories:
      - "/mobile/android"
    schedule:
      interval: weekly
      day: tuesday
      time: "04:00"
      timezone: UTC
    cooldown:
      default-days: 7
    groups:
      dependency-updates:
        patterns: ["*"]
    open-pull-requests-limit: 2
