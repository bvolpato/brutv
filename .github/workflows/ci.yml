name: BruTV CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  swift-core:
    name: Swift core tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run portable Swift tests
        run: ./test.sh --core

  release-tooling:
    name: Apple release tooling tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.4'
      - name: Test build, signing, packaging, and upload guards
        run: |
          for test in mobile/ios/BruTV/tests/test_*.py; do
            uv run --python 3.12 "$test"
          done

  join-page:
    name: Join page behavior
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Test sign-in link initialization and QR privacy
        run: node --test tools/join-page.test.mjs

  apple:
    name: Apple - ${{ matrix.name }}
    runs-on: xcode-27
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS unit tests
            target: ios-unit
            action: test
            scheme: BruTV
            simulator: iPhone 18 Pro
            test-target: BruTVTests
          - name: iPhone UI tests
            target: iphone-ui
            action: test
            scheme: BruTV
            simulator: iPhone 18 Pro
            test-target: BruTVUITests
          - name: iPad UI tests
            target: ipad-ui
            action: test
            scheme: BruTV
            simulator: iPad Pro 13-inch (M5)
            test-target: BruTVUITests
          - name: iPhone Duo UI tests
            target: duo-ui
            action: test
            scheme: BruTV
            simulator: iPhone Duo
            runtime: com.apple.CoreSimulator.SimRuntime.iOS-27-1
            test-target: BruTVUITests
          - name: tvOS simulator build
            target: tvos
            action: build
            scheme: BruTV-tvOS
            destination: generic/platform=tvOS Simulator
          - name: Mac Catalyst build
            target: catalyst
            action: build
            scheme: BruTV
            destination: generic/platform=macOS,variant=Mac Catalyst
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode 27.2
        run: |
          xcode_app=/Applications/Xcode_27.2.app
          if [[ ! -d "$xcode_app" ]]; then
            echo "error: Xcode 27.2 is required for the current Apple SDK validation" >&2
            exit 1
          fi
          sudo xcode-select --switch "$xcode_app/Contents/Developer"
          xcode_version=$(xcodebuild -version)
          echo "$xcode_version"
          if ! grep -Fxq 'Build version 27B52' <<<"$xcode_version"; then
            echo "error: stable Xcode 27.2 (27B52) is required; the runner may still have the release candidate" >&2
            exit 1
          fi
          sdks=$(xcodebuild -showsdks)
          if ! grep -Fq 'iOS 27.2' <<<"$sdks"; then
            echo "error: the selected Xcode does not include the iOS 27.2 SDK" >&2
            exit 1
          fi
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: matrix.target == 'ios-unit'
        with:
          version: '0.13.4'
      - name: Validate generated Apple asset catalogs
        if: matrix.target == 'ios-unit'
        run: uv run --python 3.12 mobile/ios/BruTV/tests/test_prepare_xtool.py
      - name: Prepare Apple destination
        id: destination
        env:
          APPLE_SIMULATOR: ${{ matrix.simulator }}
          APPLE_DESTINATION: ${{ matrix.destination }}
          APPLE_SIMULATOR_RUNTIME: ${{ matrix.runtime || 'com.apple.CoreSimulator.SimRuntime.iOS-27-2' }}
        run: |
          if [[ -n "$APPLE_SIMULATOR" ]]; then
            devices=$(xcrun simctl list devices available --json)
            simulator_id=$(jq -r --arg name "$APPLE_SIMULATOR" --arg runtime "$APPLE_SIMULATOR_RUNTIME" \
              '[.devices[$runtime][]? | select(.name == $name)][0].udid // empty' <<<"$devices")
            if [[ -z "$simulator_id" ]]; then
              device_types=$(xcrun simctl list devicetypes --json)
              device_type=$(jq -r --arg name "$APPLE_SIMULATOR" \
                '[.devicetypes[] | select(.name == $name)][0].identifier // empty' <<<"$device_types")
              if [[ -z "$device_type" ]]; then
                echo "error: required simulator type is unavailable: $APPLE_SIMULATOR" >&2
                exit 1
              fi
              simulator_id=$(xcrun simctl create "$APPLE_SIMULATOR" "$device_type" "$APPLE_SIMULATOR_RUNTIME")
            fi
            xcrun simctl bootstatus "$simulator_id" -b
            APPLE_DESTINATION="platform=iOS Simulator,id=$simulator_id"
          fi
          echo "destination=$APPLE_DESTINATION" >>"$GITHUB_OUTPUT"
      - name: Run Apple validation
        env:
          APPLE_ACTION: ${{ matrix.action }}
          APPLE_SCHEME: ${{ matrix.scheme }}
          APPLE_TARGET: ${{ matrix.target }}
          APPLE_TEST_TARGET: ${{ matrix.test-target }}
          APPLE_DESTINATION: ${{ steps.destination.outputs.destination }}
        run: |
          arguments=(
            -project mobile/ios/BruTV/BruTV.xcodeproj
            -scheme "$APPLE_SCHEME"
            -destination "$APPLE_DESTINATION"
            -derivedDataPath "$RUNNER_TEMP/apple-derived-data"
            -resultBundlePath "$RUNNER_TEMP/BruTV-$APPLE_TARGET.xcresult"
          )
          if [[ -n "$APPLE_TEST_TARGET" ]]; then
            arguments+=(-only-testing "$APPLE_TEST_TARGET" -parallel-testing-enabled NO)
          fi
          xcodebuild "$APPLE_ACTION" "${arguments[@]}" CODE_SIGNING_ALLOWED=NO
      - name: Upload Apple test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apple-${{ matrix.target }}-results
          path: ${{ runner.temp }}/BruTV-*.xcresult
          retention-days: 7
          if-no-files-found: ignore

  android:
    name: Android tests, lint, and APK builds
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            mobile/android/**/*.gradle*
            mobile/android/gradle/wrapper/gradle-wrapper.properties
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          accept-android-sdk-licenses: true
          packages: ''
      - name: Install Android API 37 and platform tools
        run: sdkmanager --install 'platform-tools' 'platforms;android-37.0'
      - name: Run Android tests and lint
        run: ./mobile/android/test.sh --no-daemon --max-workers=2 --console=plain
      - name: Build debug and preview APKs
        run: ./mobile/android/gradlew --no-daemon --max-workers=2 --console=plain -p mobile/android :app:assembleDebug :app:assemblePreview
      - name: Upload APKs and Gradle reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-apks-and-reports
          path: |
            mobile/android/app/build/outputs/apk/debug/*.apk
            mobile/android/app/build/outputs/apk/preview/*.apk
            mobile/android/app/build/reports/**
            mobile/android/app/build/test-results/**
          retention-days: 7
          if-no-files-found: ignore

  vega:
    name: Vega source tests and production bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: mobile/vega
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/vega/package-lock.json
      - name: Verify preinstalled Python 3.12
        run: python3 -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version'
      - name: Install pinned npm and lockfile dependencies
        run: |
          npm install --global npm@11.21.0
          npm ci --ignore-scripts
      - name: Build pinned Amazon-patched Shaka
        run: npm run setup:shaka
      - name: Test and typecheck Vega sources
        run: |
          npm test
          npm run typecheck
      - name: Build production Vega JavaScript bundle
        run: npm run bundle -- --entry-file index.js --platform kepler --dev false --bundle-output "$RUNNER_TEMP/brutv-vega.bundle" --assets-dest "$RUNNER_TEMP/brutv-vega-assets" --max-workers 2
      - name: Check high severity dependency advisories
        run: npm audit --audit-level=high

  ps5-desktop:
    name: PS5 desktop build and media tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential cmake ninja-build pkg-config \
            libsdl2-dev libgl-dev libavformat-dev libavcodec-dev libavutil-dev \
            libswscale-dev libswresample-dev libcurl4-openssl-dev \
            nlohmann-json3-dev ffmpeg xvfb
      - name: Build and test desktop player
        run: ./mobile/ps5/test.sh
